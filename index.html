<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ayush & Sanyukta · Wedding Invitation</title>
  <meta name="description" content="Ayush weds Sanyukta · 23rd–24th January 2027 · Stone Water Resort, Karjat" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gilda+Display&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="intro-on">

  <!-- Intro video: plays first, then fades away to reveal the invite -->
  <div id="intro" aria-label="Intro video">
    <video id="introVideo" src="book.mp4" autoplay muted playsinline preload="auto"></video>
    <button class="intro-btn intro-sound" id="introSound" aria-label="Turn sound on">🔇</button>
  </div>

  <div id="loader">
    <div class="loader-inner">
      <span class="loader-names">Ayush &amp; Sanyukta</span>
      <span class="loader-bar"><i></i></span>
    </div>
  </div>

  <!--
    The whole invite is ONE canvas, 1080 x 14926 px (= the reference design).
    Each element is placed with --x / --y / --w (and --h) in reference pixels;
    the CSS converts them to container units, so it scales exactly on any screen.
    Positions were measured against the reference by template matching.
    Elements are in PAINT ORDER: later lines are drawn on top.
  -->
  <main class="stage">

    <!-- ========== HALDI (back layer: sits under the invitation card) ========== -->
    <img class="el fade" src="assets/haldi/haldi.png" style="--x:0; --y:3206; --w:992;"
         alt="O Rangrez – Haldi · 23rd January 2027, 3 pm onwards" />
    <img class="el swing"    src="assets/haldi/marigold1.png" style="--x:130; --y:3380; --w:55;" alt="" />
    <img class="el swing d2" src="assets/haldi/marigold1.png" style="--x:985; --y:3452; --w:60;" alt="" />
    <img class="el swing d3" src="assets/haldi/mg2.png"       style="--x:808; --y:3290; --w:94;" alt="" />
    <img class="el sway"     src="assets/haldi/leaf1.png"     style="--x:848; --y:3165; --w:234;" alt="" />

    <!-- ========== INVITATION CARD ========== -->
    <img class="el fade" src="assets/intro/intro.png" style="--x:0; --y:1617; --w:1080;"
         alt="Shree Vitthalesho Jayati. Ami & Nirav Parikh request the pleasure of your presence to celebrate the wedding of their beloved son Ayush with Sanyukta" />
    <img class="el swing"    src="assets/intro/flower-hanging.png" style="--x:75;  --y:1699; --w:68;" alt="" />
    <img class="el swing d2" src="assets/intro/flower-hanging.png" style="--x:150; --y:1570; --w:68;" alt="" />
    <img class="el tree-l" src="assets/intro/tree2.png" style="--x:0;   --y:1452; --w:239;" alt="" />
    <img class="el tree-r" src="assets/intro/tree1.png" style="--x:748; --y:1260; --w:332;" alt="" />
    <img class="el swing d3" src="assets/intro/flower-hanging.png" style="--x:861; --y:1570; --w:68;" alt="" />

    <!-- ========== OUR STORY (its torn paper covers the tops of the trees) ========== -->
    <img class="el fade" src="assets/story/our-story.png" style="--x:0; --y:35; --w:1080;"
         alt="Fifteen years ago, we met without quite knowing what love meant… With love, Ayush & Sanyukta" />

    <!-- scratch the glitter heart → reveals "23rd - 24th Jan, 2027" printed on the card -->
    <div class="el scratch" id="scratch" style="--x:367; --y:2734; --w:391; --h:412;">
      <img class="scratch-img" src="assets/intro/glitter-heart.png" alt="" />
      <canvas id="scratchCanvas" aria-label="Scratch the heart to reveal the date"></canvas>
    </div>

    <!-- ========== HALDI (front layer) ========== -->
    <!-- tap the polaroid → haldi faces (box = photo inside the polaroid, tilted -7°) -->
    <button class="el haldi-photo" id="haldiPhoto" aria-label="Tap to begin the masti"
            style="--x:273; --y:3974; --w:548; --h:400;">
      <img src="assets/haldi/haldi-face.png" alt="Ayush & Sanyukta with haldi on their faces" />
    </button>
    <img class="el sway d2" src="assets/haldi/flower.png" style="--x:849; --y:4479; --w:189;" alt="" />
    <img class="el sway d3" src="assets/haldi/leaf2.png"  style="--x:0;   --y:4718; --w:204;" alt="" />

    <!-- ========== SANGEET ========== -->
    <img class="el fade" src="assets/sangeet/sangeet.png" style="--x:0; --y:5074; --w:1080;" alt="Our Soundtrack – Sangeet" />
    <img class="el vinyl" id="vinyl" src="assets/sangeet/vinyle.png" style="--x:3; --y:6814; --w:310;" alt="Vinyl record" />
    <button class="el ticket" id="ticket" style="--x:329; --y:6734; --w:582; --h:416;" aria-label="Tap to open your ticket">
      <span class="ticket-inner">
        <img class="ticket-front" src="assets/sangeet/ticket1.png" alt="You're on the guestlist!" />
        <img class="ticket-back"  src="assets/sangeet/ticket2.png" alt="Admit one · Sat 23 Jan 2027 · 7:00 PM" />
      </span>
    </button>

    <!-- ========== WEDDING (under the Mameru date note) ========== -->
    <img class="el fade" src="assets/wedding/wedding.png" style="--x:0; --y:8955; --w:1080;"
         alt="Lagnotsav – Wedding · 24th January 2027 · Safa Bandhi 3 pm · Lagna Muhurat 6:45 pm" />
    <img class="el swing"    src="assets/wedding/chandelier.png" style="--x:55;  --y:9168; --w:217;" alt="" />
    <img class="el swing d2" src="assets/wedding/chandelier.png" style="--x:772; --y:9236; --w:217;" alt="" />

    <!-- ========== MAMERU & RUKHWAT ========== -->
    <img class="el fade" src="assets/mameru/mameru.png" style="--x:0; --y:7023; --w:1080;"
         alt="2 States – Mameru & Rukhwat · 24th January 2027, 11 am onwards" />
    <img class="el swing"    src="assets/mameru/lamp3.png" style="--x:147; --y:7237; --w:69;" alt="" />
    <img class="el swing d2" src="assets/mameru/lamp2.png" style="--x:27;  --y:7481; --w:86;" alt="" />
    <img class="el dandiya"  src="assets/mameru/dandiya.png" style="--x:863; --y:8488; --w:216;" alt="" />
    <img class="el"          src="assets/sangeet/flower.png" style="--x:0; --y:7027; --w:508;" alt="" />

    <!-- ========== WARDROBE PLANNER ========== -->
    <img class="el fade" src="assets/planner/planner.png" style="--x:0; --y:11097; --w:1061;" alt="Wardrobe Planner" />
    <a class="el hotspot planner-link" href="#" style="--x:240; --y:11207; --w:560; --h:260;" aria-label="Open wardrobe planner"></a>
    <a class="el hotspot planner-link" href="#" style="--x:210; --y:11637; --w:640; --h:950;" aria-label="Open wardrobe planner"></a>

    <!-- ========== VENUE ========== -->
    <img class="el fade" src="assets/venue/venue-final.png" style="--x:0; --y:13392; --w:1080;"
         alt="Can't wait to see you in Stone Water Resort, Karjat" />
    <img class="el tree-l" src="assets/venue/tree1.png" style="--x:0;   --y:12889; --w:362;" alt="" />
    <img class="el tree-r" src="assets/venue/tree2.png" style="--x:706; --y:12867; --w:374;" alt="" />

    <div class="el countdown" id="countdown" style="--x:0; --y:13448; --w:1080;" aria-label="Countdown to the celebrations">
      <b data-k="d">00</b><i>:</i><b data-k="h">00</b><i>:</i><b data-k="m">00</b><i>:</i><b data-k="s">00</b>
    </div>
    <a class="el hotspot" href="https://www.google.com/maps/search/?api=1&query=Stone+Water+Resort+Karjat"
       target="_blank" rel="noopener" style="--x:220; --y:13690; --w:640; --h:190;" aria-label="Open Stone Water Resort, Karjat in Google Maps"></a>

  </main>

  <script src="script.js"></script>
</body>
</html>
